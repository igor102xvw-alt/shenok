<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой Мессенджер</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Экран входа -->
  <div id="login-screen" class="screen">
    <div class="login-container">
      <h1>puppy</h1>
      <input type="password" id="password" placeholder="Пароль" autocomplete="off">
      <input type="text" id="nickname" placeholder="Ник">
      <button onclick="login()">Войти</button>
      <p id="error" class="error"></p>
    </div>
  </div>

  <!-- Основной интерфейс -->
  <div id="chat-screen" class="screen hidden">
    <div class="app-container">
      <!-- Левая панель: Список пользователей -->
      <div class="sidebar">
  <div class="sidebar-header">
    <h2>💬 Чаты</h2>
  </div>
  <div class="chats-list" id="chats-list">
    <!-- Список чатов будет здесь -->
  </div>
</div>

      <!-- Правая панель: Чат -->
      <div class="chat-container">
        <div class="chat-header">
          <h2>💬 Общий чат</h2>
        </div>
        <div class="messages-container" id="messages">
          <!-- Сообщения будут здесь -->
        </div>
        <div class="input-area">
  <input type="text" id="message" placeholder="Сообщение..." autocomplete="off">
  <button onclick="sendMessage()">Отправить</button>
</div>
<div id="typing-indicator" class="typing-indicator"></div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
